name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(exist_ok=True)"
      - name: Run Ruff
        run: uv run --no-sync python -m ruff check src tests

  pytest-offline:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(exist_ok=True)"
      - name: Run no-hardware Core, CLI and Worker tests
        run: uv run --no-sync python -m pytest -q tests
      - name: Windows offline CLI preflight
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\preflight-cli.ps1
          if ($LASTEXITCODE -ne 0) { throw "Offline CLI preflight failed ($LASTEXITCODE)" }

  detect-packaging-changes:
    name: Detect packaging changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v6
      - name: Filter packaging inputs
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            packaging:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/electronicload_tool_cli/cli.py'
              - 'src/electronicload_tool_core/__init__.py'
              - 'src/electronicload_tool_cli/__init__.py'
              - '.github/workflows/tests.yml'

  package-smoke:
    name: Python wheel/sdist and clean-install smoke (no hardware)
    needs: detect-packaging-changes
    if: needs.detect-packaging-changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests/dist').mkdir(parents=True, exist_ok=True)"
      - name: Build wheel and sdist
        run: uv run --no-sync python -m build --outdir .tmp_tests/dist
      - name: Install actual wheel into a clean environment and smoke CLI
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE/.tmp_tests/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$GITHUB_WORKSPACE/.tmp_tests/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$wheel" && test -n "$sdist"
          uv venv .tmp_tests/install-venv --python 3.13
          uv pip install --python .tmp_tests/install-venv/bin/python "$wheel"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/python" -c 'import electronicload_tool_core, electronicload_tool_cli'
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/electronicload-tool" --help > /dev/null
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/electronicload-tool" --version
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/electronicload-tool" manifest --json > /dev/null
