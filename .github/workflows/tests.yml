name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(exist_ok=True)"
      - name: Run Ruff
        run: uv run --no-sync python -m ruff check src tests

  pytest-linux:
    name: Linux Python ${{ matrix.python-version }}
    needs: detect-validation-changes
    if: needs.detect-validation-changes.outputs.fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(exist_ok=True)"
      - name: Run offline Core, CLI and Worker contracts
        run: uv run --no-sync python -m pytest -q tests --ignore=tests/test_live_validation_script.py

  pytest-windows:
    name: Windows Python ${{ matrix.python-version }}
    needs: detect-validation-changes
    if: needs.detect-validation-changes.outputs.fast == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(exist_ok=True)"
      - name: Run offline Core, CLI and Worker contracts
        run: uv run --no-sync python -m pytest -q tests --ignore=tests/test_live_validation_script.py

  detect-validation-changes:
    name: Detect Windows validation and packaging changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      fast: ${{ steps.filter.outputs.fast }}
      validation: ${{ steps.filter.outputs.validation }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v6
      - name: Select affected offline and validation boundaries
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            fast:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/tests.yml'
            validation:
              - 'scripts/preflight-cli.ps1'
              - 'scripts/live-cli-check.ps1'
              - 'tests/test_live_validation_script.py'
              - 'src/electronicload_tool_core/**'
              - 'src/electronicload_tool_cli/**'
              - 'tests/conftest.py'
              - 'tests/test_readonly_cli.py'
              - 'tests/test_readonly_core.py'
              - 'tests/test_control_core.py'
              - 'tests/test_control_cli.py'
              - 'tests/test_list_core.py'
              - 'tests/test_list_cli.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/tests.yml'
            packaging:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/electronicload_tool_cli/cli.py'
              - 'src/electronicload_tool_core/__init__.py'
              - 'src/electronicload_tool_cli/__init__.py'
              - '.github/workflows/tests.yml'

  windows-validation:
    name: Windows PowerShell validation contracts
    needs: detect-validation-changes
    if: needs.detect-validation-changes.outputs.validation == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(exist_ok=True)"
      - name: Run offline PowerShell preflight contracts (fake VISA only)
        run: uv run --no-sync python -m pytest -q -rs --durations=12 tests/test_live_validation_script.py -k preflight

  windows-live-validation:
    name: Windows Live Validation script contracts
    needs: detect-validation-changes
    if: needs.detect-validation-changes.outputs.validation == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests').mkdir(exist_ok=True)"
      - name: Run Windows Live Validation script tests (fake VISA only)
        run: uv run --no-sync python -m pytest -q -rs --durations=12 tests/test_live_validation_script.py -k "not preflight"

  package-smoke:
    name: Python packaging smoke
    needs: detect-validation-changes
    if: needs.detect-validation-changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install locked dependencies
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy
      - name: Prepare ignored test directory
        run: python -c "from pathlib import Path; Path('.tmp_tests/dist').mkdir(parents=True, exist_ok=True)"
      - name: Build wheel and sdist
        run: uv run --no-sync python -m build --outdir .tmp_tests/dist
      - name: Install actual wheel into a clean environment and smoke CLI
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$GITHUB_WORKSPACE/.tmp_tests/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find "$GITHUB_WORKSPACE/.tmp_tests/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$wheel" && test -n "$sdist"
          uv venv .tmp_tests/install-venv --python 3.13
          uv pip install --python .tmp_tests/install-venv/bin/python "$wheel"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/python" -c 'import electronicload_tool_core, electronicload_tool_cli'
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/electronicload-tool" --help > /dev/null
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/electronicload-tool" --version
          "$GITHUB_WORKSPACE/.tmp_tests/install-venv/bin/electronicload-tool" manifest --json > /dev/null
